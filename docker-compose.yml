services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/watchlist
      JWT_SECRET: change_me
      JWT_EXPIRE_MINUTES: 60
      MARKET_STALE_THRESHOLD_SECONDS: 120
      CORS_ORIGINS: http://localhost:5173
      ENV: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      - postgres

  market-ingestion:
    build: ./backend
    command: python -m app.workers.fresh_ingestion
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/watchlist
      MARKET_STALE_THRESHOLD_SECONDS: 600
      SIMULATION_INTERVAL_SECONDS: ${SIMULATION_INTERVAL_SECONDS:-30}
      REPLAY_SCENARIO: data/scenarios/historical_update_57.json
      DATABASE_RETRY_SECONDS: 5
      ENV: development
    volumes:
      - ./backend:/app
      - ./data:/app/data:ro
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: watchlist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    ports:
      - "8080:8080"

volumes:
  pgdata:
